# Kernel-side package for the MidBrain Memory skill, installed by
# `npx midbrain-memory-mcp install`. Prime Agent imports it into every
# session's Python kernel. It has no dependencies: the search shortcut uses
# the kernel's own `rlm.mcp` module and the capture watcher is a Node process.
[project]
name = "midbrain-memory"
version = "0.1.0"
description = "MidBrain Memory for Prime Agent: memory search shortcut and conversation capture"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midbrain_memory"]
