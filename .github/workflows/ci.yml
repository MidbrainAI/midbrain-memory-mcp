name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS/Node combination; never let one failure mask the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin bundle
        run: npm run build:plugin

      - name: Run tests
        # Git Bash is available on Windows runners; use it everywhere for
        # consistent behavior.
        shell: bash
        run: npm test

  # Lint and the docs/isolation gate scripts (POSIX shell) run once. Keeping
  # them off the full OS/Node matrix avoids redundant lint runs and Windows
  # shell fragility while still gating every push and PR.
  check:
    name: lint + gates (ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, test, and run gate scripts
        run: npm run check
